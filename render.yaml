services:
  - type: web
    name: stock-analyser
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn --workers 1 --worker-class sync --timeout 120 --max-requests 100 stockpulse.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: stockpulse.settings
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "127.0.0.1,localhost"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
